name: docs

# Docs-as-code: the repo carries ONE config file (kura.toml) + this workflow. The kurajs/pages action
# builds a searchable, agent-native static site from docs/. openab is special: its gh-pages ROOT also
# hosts a Helm chart repo (index.yaml, written there by helm/chart-releaser-action), so we build with
# the action (deploy: false) and publish ourselves, carrying index.yaml back in so `helm repo add …
# /openab` keeps working at /openab/index.yaml next to the docs homepage.

on:
  push:
    branches: [main, docs/kura-site]
    paths:
      - "docs/**"
      - "kura.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write # peaceiris pushes the built site to the gh-pages branch

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: kura
        uses: kurajs/pages@v1
        with:
          deploy: false # openab publishes itself (below) to carry the Helm files alongside the docs

      # chart-releaser only writes index.yaml to gh-pages (the chart .tgz live on Releases), so carry
      # index.yaml (+ README) into the publish dir to keep the Helm repo working next to the docs.
      - name: Carry over the Helm chart repo files from gh-pages
        run: |
          git fetch origin gh-pages --depth 1 2>/dev/null || true
          for f in index.yaml README.md; do
            git show "origin/gh-pages:$f" > "${{ steps.kura.outputs.dir }}/$f" 2>/dev/null && echo "kept $f" || true
          done

      - name: Publish to gh-pages root (docs homepage; Helm index.yaml preserved)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ steps.kura.outputs.dir }}
          keep_files: false
          commit_message: "docs: publish Kura site (${{ github.sha }})"
