name: docs

# Convention over configuration: the repo carries ONE config file (kura.toml) + its docs/. This
# workflow scaffolds an ephemeral Kura app from kura.toml (package.json, app/global.css, tsconfig,
# a landing page — all generated by .github/kura-scaffold.mjs), builds a static site, and publishes
# it to the gh-pages ROOT. `keep_files: true` preserves everything else already on gh-pages — the
# Helm chart repo's index.yaml (a different file) keeps serving at /openab/index.yaml, side by side
# with the docs homepage. (In a real setup, kura-scaffold.mjs would live inside a published action —
# e.g. `uses: kurajs/pages@v1` — leaving the repo with just kura.toml + a 6-line workflow.)

on:
  push:
    branches: [main, docs/kura-site]
    paths:
      - "docs/**"
      - "kura.toml"
      - ".github/workflows/docs.yml"
      - ".github/kura-scaffold.mjs"
  workflow_dispatch:

permissions:
  contents: write # peaceiris pushes the built site to the gh-pages branch

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Scaffold ephemeral Kura app from kura.toml, then build
        run: |
          bun .github/kura-scaffold.mjs "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.kura-build"
          cd .kura-build
          bun install
          bun run build

      # Clean-replace the docs each deploy (no stale paths pile up), but carry the Helm chart repo's
      # files INTO the publish dir first so they survive: chart-releaser only writes index.yaml to
      # gh-pages (the chart .tgz live on GitHub Releases), so preserving index.yaml (+ README) keeps
      # `helm repo add … https://<owner>.github.io/openab` working alongside the docs at the root.
      - name: Carry over the Helm chart repo files from gh-pages
        run: |
          git fetch origin gh-pages --depth 1 2>/dev/null || true
          for f in index.yaml README.md; do
            git show "origin/gh-pages:$f" > ".kura-build/dist/static/$f" 2>/dev/null && echo "kept $f" || rm -f ".kura-build/dist/static/$f"
          done

      - name: Publish to gh-pages root (docs homepage; Helm index.yaml preserved)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .kura-build/dist/static
          keep_files: false # clean replace — carried-over index.yaml (above) is what preserves Helm
          commit_message: "docs: publish Kura site (${{ github.sha }})"
