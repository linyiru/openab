name: docs

# Build the Kura docs site (docs-site/, which mounts the repo's own docs/) and publish the
# prerendered static output to the gh-pages ROOT — so the docs index.html is the site homepage.
# `keep_files: true` means it never deletes anything else already on gh-pages: the Helm chart repo's
# index.yaml (a different file) is preserved and keeps serving at /openab/index.yaml. The Helm
# release (helm/chart-releaser-action) only ever commits index.yaml, so the two coexist.

on:
  push:
    branches: [main, docs/kura-site]
    paths:
      - "docs/**"
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write # peaceiris pushes the built site to the gh-pages branch

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build the static docs site
        working-directory: docs-site
        run: |
          bun install
          bun run build

      - name: Publish to gh-pages/docs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs-site/dist/static
          # published to gh-pages root (no destination_dir) → docs index.html is the homepage
          keep_files: true # preserve everything else already on gh-pages (Helm index.yaml, charts, …)
          commit_message: "docs: publish Kura site (${{ github.sha }})"
