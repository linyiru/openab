name: docs

# Convention over configuration: the repo carries ONE config file (kura.toml) + its docs/. This
# workflow scaffolds an ephemeral Kura app from kura.toml (.github/kura-scaffold.mjs), builds a
# static site, and publishes it to the gh-pages ROOT so the docs index.html is the site homepage.
# `keep_files: false` clean-replaces the docs, but the Helm chart repo's index.yaml (a different
# file, written to gh-pages by helm/chart-releaser-action) is carried back in first, so
# `helm repo add … /openab` keeps working at /openab/index.yaml alongside the docs homepage.
# (In a real setup, kura-scaffold.mjs would live inside a published `uses: kurajs/pages@v1` action.)

on:
  push:
    branches: [main, docs/kura-site]
    paths:
      - "docs/**"
      - "kura.toml"
      - ".github/workflows/docs.yml"
      - ".github/kura-scaffold.mjs"
  workflow_dispatch:

permissions:
  contents: write # peaceiris pushes the built site to the gh-pages branch

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Scaffold ephemeral Kura app from kura.toml, then build
        run: |
          bun .github/kura-scaffold.mjs "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.kura-build"
          cd .kura-build
          bun install
          bun run build

      - name: Carry over the Helm chart repo files from gh-pages
        run: |
          git fetch origin gh-pages --depth 1 2>/dev/null || true
          for f in index.yaml README.md; do
            git show "origin/gh-pages:$f" > ".kura-build/dist/static/$f" 2>/dev/null && echo "kept $f" || rm -f ".kura-build/dist/static/$f"
          done

      - name: Publish to gh-pages root (docs homepage; Helm index.yaml preserved)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .kura-build/dist/static
          keep_files: false
          commit_message: "docs: publish Kura site (${{ github.sha }})"
